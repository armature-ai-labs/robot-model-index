model = "gemini-robotics-er-2"
provider = "google-ai-studio"
provider_name = "Gemini Developer API (Google AI Studio)"
provider_model_id = "gemini-robotics-er-2-preview"
kind = "hosted-api"
access = "public"
status = "draft"
last_verified = "2026-11-12"
verified_by = ""
paid_data_used_to_improve_products = false
notes = "Input/output pricing applies to the standard and streaming endpoints. Cache and batch fields apply only to the standard endpoint. The streaming endpoint has no published cache or batch price."

[[variants]]
id = "gemini-robotics-er-2-streaming-preview"
notes = "Live API endpoint with function calling. Same dated input/output prices as standard; no context caching, code execution or structured outputs. See s1 pricing and s2 model capabilities."

[free_tier]
available = true
data_used_to_improve_products = true
sources = ["s1"]

# Discounted rates run through 31 Dec 2026, then double. No start date is published.
[[pricing]]
unit = "usd_per_million_tokens"
effective_to = "2026-12-31"
input = 1.00
output = 5.00
cached_input = 0.10
cache_storage_per_million_per_hour = 0.50
batch_input = 0.50
batch_output = 2.50
notes = "Paid tier, both endpoints: all input modalities $1 and text output $5 per million tokens. Standard output includes thinking. Cache and batch fields are standard-only. Streaming has the same published Google Search allowance and charges as standard: 5,000 free searches/month shared across Gemini 3 and newer, then $14/1,000, daily cap 1,500."
sources = ["s1"]

[[pricing]]
unit = "usd_per_million_tokens"
effective_from = "2027-01-01"
input = 2.00
output = 10.00
cached_input = 0.20
cache_storage_per_million_per_hour = 1.00
batch_input = 1.00
batch_output = 5.00
notes = "Paid tier, both endpoints. Standard output includes thinking tokens; cache and batch fields are standard-only."
sources = ["s1"]

[[terms]]
text = "The pricing table marks free-tier data as used for product improvement and paid-tier data as not used. The terms make exceptions for the EEA, Switzerland and UK and define paid status by billing-account access. Do not submit sensitive information to unpaid services."
sources = ["s1", "s3"]

[[terms]]
text = "The streaming variant uses the Live API and supports function calling, but not context caching, code execution, structured outputs or batch inference. Its input/output rates and published change dates match the standard endpoint."
sources = ["s1", "s2"]

[[terms]]
text = "Gemini API use is for professional or business development. Regional, age, safety and prohibited-use restrictions apply; EEA, Swiss and UK user-facing clients require paid services."
sources = ["s3"]

