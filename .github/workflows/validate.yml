name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate entries
        run: python scripts/validate.py
      - name: Build preview (drafts included)
        run: python scripts/build.py --include-drafts --out dist-preview
      - uses: actions/upload-artifact@v4
        with:
          name: preview-json
          path: dist-preview/
