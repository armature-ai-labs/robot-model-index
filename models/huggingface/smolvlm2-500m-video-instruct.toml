  { id = "s2", url = "https://huggingface.co/blog/smolvlm2", title = "Hugging Face SmolVLM2 release, 20 February 2025", kind = "primary", accessed = "2026-11-12" },
  { id = "s3", url = "https://github.com/huggingface/transformers/blob/main/src/transformers/models/smolvlm/modeling_smolvlm.py", title = "SmolVLM reference inference implementation and Apache header", kind = "primary", accessed = "2026-11-12" },
  { id = "s4", url = "https://huggingface.co/HuggingFaceTB/SmolVLM-500M-Instruct", title = "Immediate predecessor checkpoint card and Apache licence", kind = "primary", accessed = "2026-11-12" },
