id = "smolvlm2-500m-video-instruct"
name = "SmolVLM2-500M-Video-Instruct"
developer = "huggingface"
roles = ["vlm"]
summary = "Hugging Face's small video, image and text model produces text descriptions and answers. This entry selects the 500M checkpoint used as SmolVLA's backbone, not the whole SmolVLM2 family or a robot action policy."
