  { id = "s8", url = "https://github.com/huggingface/lerobot/blob/main/src/lerobot/policies/smolvla/configuration_smolvla.py", title = "SmolVLA configuration, exact VLM checkpoint identity", kind = "primary", accessed = "2026-11-12" },
