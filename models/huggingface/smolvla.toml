id = "smolvla"
name = "SmolVLA"
developer = "huggingface"
roles = ["vla"]
summary = "Compact open vision-language-action model from Hugging Face's LeRobot team. Pretrained at 450M parameters and designed to be fine-tuned on LeRobot datasets, it outputs chunks of continuous robot actions and runs on consumer GPUs and small edge boards."
release_date = "2025-06"
lifecycle = "released"
status = "draft"
last_verified = "2026-11-12"
verified_by = ""

[modalities]
input = ["text", "image", "robot-state"]
output = ["actions"]
sources = ["s2"]

[access]
type = ["open-weights"]
notes = "Base checkpoint lerobot/smolvla_base on the Hugging Face Hub; fine-tune it on your own robot's demonstrations."
sources = ["s1"]

[architecture]
parameters = "450M"
built_on = "SmolVLM2-500M-Video-Instruct vision-language backbone with a flow-matching action expert"
frameworks = ["pytorch", "lerobot"]
sources = ["s1", "s2"]

[licence]
code = "apache-2.0"
weights = "apache-2.0"
training_data = "The paper reports 481 selected community robot datasets and Qwen2.5-VL-3B-Instruct task annotations. A local count finds 532 unique repository IDs in its appendix; the selected subset is not mapped. Two individually read current cards declare Apache 2.0, not a complete licence audit. Original revisions and backbone data rights remain unverified."
commercial_use = "unclear"
commercial_use_reason = "SmolVLA code, weights and the direct SmolVLM2 backbone declare Apache 2.0. The reported 481-dataset selection is not reconciled with the 532 listed IDs. Actual training-time revisions, full dataset rights, backbone data and annotation terms remain unverified. Current card labels and permissive checkpoint terms do not resolve that chain."
sources = ["s2", "s3", "s8", "s9", "s10", "s11"]

[[licence.base_models]]
name = "SmolVLM2-500M-Video-Instruct"
licence = "apache-2.0"
relation = "backbone"

[robotics]
action_output = "continuous-actions"
action_chunk = 50
default_denoising_steps = 10
max_state_dim = 32
max_action_dim = 32
image_resolution = "512x512 (resized with padding)"
notes = "Defaults from LeRobot's SmolVLA configuration. A community benchmark found 1 denoising step kept task success on LIBERO (see benchmarks)."
sources = ["s2"]

[hardware]
runs = "local"

[[hardware.fit]]
device = "jetson-orin-nano-8gb"
status = "community-reported"
result = "lerobot/smolvla_base, 2 camera views, split TensorRT engines (mostly FP16): p50 107.55 ms (9.30 Hz), 1.78 GB whole-board RAM. JetPack 7.2.1, TensorRT 10.16.2.10, MAXN_SUPER, pinned clocks, desktop running, 300-second synthetic-observation run, 10 denoising steps, chunk 50. Not a physical task-success test."
date = "2026-10-13"
sources = ["s5", "s12"]

[[hardware.fit]]
device = "rtx-5090-laptop-24gb"
status = "community-reported"
result = "lerobot/smolvla_libero: 111.0 ms median per decision with LeRobot defaults; 14.4 ms with 1 denoising step and whole-model compile; GPU energy 11.00 J vs 1.44 J per decision."
date = "2026-11-12"
sources = ["s4"]

[[benchmarks]]
name = "LIBERO (4 suites x 10 tasks x 10 episodes)"
score = "82.00% (328/400)"
settings = "lerobot/smolvla_libero; identical success with LeRobot defaults and with 1 denoising step plus whole-model compile"
run_by = "Sisir Kausthubh"
run_by_type = "independent"
date = "2026-11"
sources = ["s4"]

[serving]
protocols = ["lerobot-grpc-policy-server"]
runtimes = ["lerobot", "vla.cpp"]
sources = ["s1", "s6"]

[[limitations]]
text = "The 1-step denoising speed-up was validated only on LIBERO; other tasks or robots may need more steps."
sources = ["s4"]

[[limitations]]
text = "Exported or converted versions (ONNX, TensorRT, GGUF) can drift numerically from the PyTorch original; the vla.cpp authors report a precision mismatch in SmolVLA's position embeddings large enough to reverse the gripper command. Check outputs against the original before running on a real arm."
sources = ["s7"]

[[limitations]]
text = "Section 3.2 and Table 1 report 481 selected datasets, while a local parse of Appendix A.1 lists 532 unique repository IDs. The sources do not map the selected subset. The two individually read cards below declare Apache 2.0 today, not a verified licence grant for every dataset or original training revision."
sources = ["s9", "s10", "s11"]

