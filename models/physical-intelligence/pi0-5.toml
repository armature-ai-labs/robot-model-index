# Licence-chain example: Apache 2.0 code, but the model is built on PaliGemma,
# which brings the Gemma Terms of Use into the picture.

id = "pi0-5"
name = "π0.5 (pi0.5)"
developer = "physical-intelligence"
roles = ["vla"]
summary = "Vision-language-action model from Physical Intelligence aimed at open-world generalization, such as cleaning kitchens and bedrooms in homes it has never seen. Base and fine-tuned checkpoints are released openly in the openpi repository, pre-trained on 10k+ hours of robot data."
release_date = "2025-04-22"
lifecycle = "released"
status = "draft"
last_verified = "2026-11-12"
verified_by = ""

[modalities]
input = ["text", "image", "robot-state"]
output = ["actions"]
sources = ["s1", "s3"]

[access]
type = ["open-weights"]
notes = "Checkpoints download from Physical Intelligence's public storage via the openpi repository: pi05_base (for fine-tuning), plus pi05_droid and pi05_libero (fine-tuned). Open weights were added to openpi in September 2025; the paper came out in April 2025."
sources = ["s1"]

[architecture]
built_on = "PaliGemma vision-language model (SigLIP image encoder plus Gemma language model) with a separate action expert"
frameworks = ["jax", "pytorch"]
sources = ["s1", "s3"]

[licence]
code = "apache-2.0"
weights = "not-stated"
training_data = "Physical Intelligence robot data (10k+ hours) and other sources; not public."
commercial_use = "unclear"
commercial_use_reason = "The code is Apache 2.0, but the reviewed README and code licence do not establish checkpoint licence scope or the full training-data rights chain. PaliGemma brings Gemma use and redistribution duties; the repository bundles older Gemma terms than Google's current page. Those known obligations do not resolve the remaining rights gaps."
sources = ["s1", "s2", "s3", "s4", "s9"]

[[licence.base_models]]
name = "PaliGemma"
licence = "gemma-terms-of-use"
relation = "initialised-from"

[robotics]
action_output = "continuous-actions"
notes = "openpi supports only the flow-matching action head for π0.5 training and inference."
sources = ["s1"]

[hardware]
runs = "local"

[[hardware.fit]]
device = "jetson-orin-nano-8gb"
status = "community-reported"
result = "Community split TensorRT 10.16.2.10, mostly FP16 with selected FP32 operations: lerobot/pi05_base, 3 views, 10 denoising steps, chunk 50, p50 643.39 ms (1.55 Hz), 6.18 GB whole-board RAM; openpi pi05_libero, 2 views, 10 steps, chunk 10, 438.47 ms (2.28 Hz), 6.39 GB. JetPack 7.2.1, MAXN_SUPER, pinned clocks, desktop running, 300-second synthetic-observation runs. Run repo cb39dcf6d83f57beb81d20d876a3dc359443fde4. No robot task success measured."
date = "2026-10-13"
sources = ["s5", "s10", "s11"]

[serving]
protocols = ["openpi-websocket"]
runtimes = ["openpi", "lerobot", "vla.cpp"]
sources = ["s1", "s6"]

[[limitations]]
text = "Fine-tuned 'expert' checkpoints were trained on relatively small datasets from robots such as ALOHA and the DROID Franka setup, and may not work on your robot."
sources = ["s1"]

[[limitations]]
text = "Physical Intelligence announced a waitlisted Pi API beta on 13 October 2026 for fine-tuning and hosted inference. The reviewed announcement and waitlist do not identify a pi0.5 endpoint, price or service terms. No hosted provider is attached to this checkpoint without that mapping."
sources = ["s7", "s8"]

[[limitations]]
text = "openpi's bundled Gemma terms are dated 21 February 2024; Google's current terms are dated 1 April 2026 and list PaliGemma in their appendix. The applicable checkpoint terms and version need maintainer confirmation."
sources = ["s4", "s9"]

[links]
repo = "https://github.com/Physical-Intelligence/openpi"
paper = "https://arxiv.org/abs/2504.16054"

