# Template entry. Exercises preview status, dated pricing (see providers/),
# two providers with different terms, and a cloud-only model.

id = "gemini-robotics-er-2"
name = "Gemini Robotics ER 2"
developer = "google-deepmind"
roles = ["embodied-reasoning"]
summary = "Vision-language model for robotics from Google DeepMind. Reasons about a robot's physical surroundings (spatial reasoning, pointing, instrument reading, video moment finding and progress classification) and orchestrates multi-step tasks by calling the robot's functions or running generated code. It outputs text and tool calls, not motor commands."
release_date = "2026-10-27"
lifecycle = "preview"
status = "draft"
last_verified = "2026-11-12"
verified_by = ""

[modalities]
input = ["text", "image", "video", "audio"]
output = ["text", "tool-calls"]
sources = ["s2", "s3"]

[access]
type = ["public-api"]
notes = "Standard endpoint through the Gemini Developer API and Google Cloud. The Developer API also offers gemini-robotics-er-2-streaming-preview through the Live API, catalogued as a provider variant. Cloud's model page lists only the standard endpoint."
sources = ["s1", "s3"]

[architecture]
parameters = "not disclosed"
built_on = "Gemini 3.5 Flash"
sources = ["s3", "s4"]

[licence]
code = "proprietary"
weights = "proprietary"
training_data = "not disclosed"
commercial_use = "unclear"
commercial_use_reason = "Cloud explicitly permits commercial preview use subject to its agreement, and Gemini API terms allow professional/business development with restrictions. That establishes conditional API permission, not a fully checked model licence chain: training-data rights and internal base-model licences are undisclosed. Under this index's full-chain rule the overall verdict stays unclear; no code or weight redistribution rights are established."
sources = ["s4", "s5"]

[robotics]
action_output = "tool-calls-and-code"
notes = "A high-level reasoning model. It plans and calls your robot's functions; a separate controller or action model moves the robot."
sources = ["s1", "s3"]

[hardware]
runs = "cloud-only"

[serving]
protocols = ["gemini-api-rest", "google-genai-sdk"]
sources = ["s1"]

[[limitations]]
text = "Preview model. Google may change or retire it; the previous version (Gemini Robotics ER 1.6) was shut down at the end of August after ER 2 replaced it."
sources = ["s1"]

[[limitations]]
text = "Google says the model was built with safety in mind, but keeping a safe environment around the robot is the developer's responsibility."
sources = ["s1"]

[[limitations]]
text = "The standard endpoint does not support the Live API. Real-time streaming needs the separate streaming endpoint, which has a smaller feature set (no caching, code execution or structured outputs)."
sources = ["s2"]

[[limitations]]
text = "Provider dates differ: the Developer API model page says latest update July 2026, while Cloud lists a release date of 27 October 2026. The release_date above records Cloud's date, not a confirmed universal launch date."
sources = ["s2", "s3"]

[links]
docs = "https://ai.google.dev/gemini-api/docs/generate-content/robotics-overview"

